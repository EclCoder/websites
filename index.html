<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Python Turtle Animation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Virtual video: 1080 × 1920 -->

    <main id="video">

        <!-- ================= CODE SCENE ================= -->

        <section id="codeScene" class="scene active">

            <div class="editor">

                <div class="titlebar">

                    <div class="traffic-lights">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="filename">
                        main.py
                    </div>

                </div>

                <div class="editor-body">

                    <div
                        id="lineNumbers"
                        class="line-numbers"
                    ></div>

                    <div
                        id="codeContainer"
                        class="code-container"
                    ></div>

                </div>

            </div>

        </section>


        <!-- ================= OUTPUT SCENE ================= -->

        <section id="outputScene" class="scene">

            <div class="output-window">

                <div class="output-title">
                    OUTPUT
                </div>

                <canvas
                    id="turtleCanvas"
                    width="800"
                    height="800"
                ></canvas>

            </div>

        </section>

    </main>


    <script type="module" src="script.js"></script>

</body>
</html>
